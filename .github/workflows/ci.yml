# PR·병합마다 백엔드 통합 테스트와 프론트 lint·빌드를 돌려요 (CLAUDE.md 8장 1~2).
# 백엔드 테스트는 Testcontainers로 진짜 PostgreSQL 17을 띄우는데, GitHub 러너에는 Docker가 있어서 따로 설정할 게 없어요.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소해요
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀌어서, 러너가 바뀌어 깨지는 일이 없게 버전을 고정해요
jobs:
  backend:
    name: backend (gradle test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test
        run: |
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee gradle-test.log

      # 컴파일 오류처럼 테스트 리포트가 안 생기는 실패도 Checks 화면에서 원인을 볼 수 있게 annotation으로 올려요
      - name: Build errors
        if: failure()
        run: |
          grep -E "error:|warning: \[|What went wrong|FAILED|Exception" gradle-test.log | head -10 \
            | sed -e 's/%/%25/g' -e 's/^/::error title=Gradle::/' || true

      # 몇 건이 돌았는지 실행 요약과 로그에 남겨요 (실패해도 남게 always)
      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              print(f"- {root.get('name')}: {root.get('tests')}건")
          print(f"\nTOTAL tests={total} failures={failures} errors={errors} skipped={skipped}")
          EOF
          # 실행 요약 페이지를 열지 않아도 PR의 Checks 화면(annotation)에서 건수를 볼 수 있게 해요
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in sorted(glob.glob('build/test-results/test/*.xml'))]
          total = sum(int(r.get('tests', 0)) for r in roots)
          failed = sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in roots)
          skipped = sum(int(r.get('skipped', 0)) for r in roots)
          per_class = ', '.join(f"{r.get('name').rsplit('.', 1)[-1]}={r.get('tests')}" for r in roots)
          print(f"::notice title=Backend tests::tests={total} failed={failed} skipped={skipped}")
          print(f"::notice title=Backend tests by class::{per_class}")
          shown = 0
          for r in roots:
              for case in r.iter('testcase'):
                  bad = case.find('failure') if case.find('failure') is not None else case.find('error')
                  if bad is not None and shown < 8:
                      shown += 1
                      detail = (bad.get('message') or bad.text or '').replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:1500]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
