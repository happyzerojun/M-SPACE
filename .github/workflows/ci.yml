# PR·병합마다 백엔드 통합 테스트와 프론트 lint·빌드를 돌려요 (CLAUDE.md 8장 1~2).
# 백엔드 테스트는 Testcontainers로 진짜 PostgreSQL 17을 띄우는데, GitHub 러너에는 Docker가 있어서 따로 설정할 게 없어요.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소해요
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (gradle test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test
        run: ./gradlew test --no-daemon

      # 몇 건이 돌았는지 실행 요약과 로그에 남겨요 (실패해도 남게 always)
      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              print(f"- {root.get('name')}: {root.get('tests')}건")
          print(f"\nTOTAL tests={total} failures={failures} errors={errors} skipped={skipped}")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
