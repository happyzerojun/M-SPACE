# M-SPACE 운영 구성 (docs/배포-가이드.md)
#   db    : PostgreSQL 17 — 외부에 포트를 열지 않아요(같은 도커 네트워크의 app만 접속)
#   app   : 화면 + API 이미지 하나 (루트 Dockerfile)
#   proxy : Caddy — HTTPS 인증서 자동 발급·갱신(Let's Encrypt), 80/443만 외부에 열어요
# 실행: cd deploy && cp .env.prod.example .env && (값 채우기) && docker compose -f docker-compose.prod.yml up -d --build
# 학교 서버에 이미 Nginx 같은 리버스 프록시가 있으면 proxy 서비스를 빼고 nginx.conf.example을 참고해요.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mspace
      POSTGRES_USER: mspace
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정해 주세요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mspace -d mspace"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mspace:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mspace
      DB_USERNAME: mspace
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET(32바이트 이상)을 설정해 주세요}
      # 첫 배포 때만 채우고, 관리자가 첫 로그인해 비밀번호를 바꾼 뒤에는 지워요 (AdminBootstrap)
      BOOTSTRAP_ADMIN_STUDENT_NO: ${BOOTSTRAP_ADMIN_STUDENT_NO:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-관리자}
    # 외부 포트를 열지 않아요. 모든 요청은 proxy(HTTPS)를 거쳐요 → 요청 수 제한이 실제 IP로 세져요
    expose:
      - "8080"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?.env에 DOMAIN(예: mspace.example.ac.kr)을 설정해 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # 발급받은 인증서
      - caddy-config:/config

volumes:
  pgdata:
  caddy-data:
  caddy-config:
